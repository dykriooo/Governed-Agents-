[project]
name = "governai"
version = "0.1.0"
description = "Governed autonomous agent platform (hackathon MVP)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "pyjwt>=2.9",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "playwright>=1.47",
  "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["governai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
